name: Deploy Relay frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Relay-CRM
      NEXT_PUBLIC_API_BASE_URL: https://relay-crm-api.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static Next frontend (docs)
        run: npm run export:next

      - name: Build Vite workspace (Rohit's CRM dashboard)
        run: npm run build
        env:
          VITE_BASE_PATH: /Relay-CRM/

      - name: Merge docs and setup GitHub Pages SPA
        run: |
          mkdir -p dist/docs
          cp -r next-ui/out/docs/* dist/docs/ 2>/dev/null || true
          cp -r next-ui/out/_next dist/ 2>/dev/null || true
          cp -r public/* dist/ 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
