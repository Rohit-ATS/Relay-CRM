services:
  - type: web
    name: relay-crm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: OAUTH_SIGNING_SECRET
        sync: false
      - key: RELAY_API_BASE_URL
        value: https://relay-crm-api.onrender.com

  - type: web
    name: relay-crm-ai
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://rohit-ats.github.io,https://relay-crm-5y4c.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: relay-crm-app
    runtime: static
    buildCommand: npm run build:render
    staticPublishPath: dist
    envVars:
      - key: VITE_BASE_PATH
        value: /
      - key: NEXT_PUBLIC_BASE_PATH
        value: ""
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://relay-crm-api.onrender.com
      - key: VITE_API_URL
        value: https://relay-crm-ai.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /docs
        destination: /docs/index.html
      - type: rewrite
        source: /docs/*
        destination: /docs/index.html
      - type: rewrite
        source: /*
        destination: /index.html
